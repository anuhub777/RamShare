# Render Blueprint Specification for RAMShare
# Deploy using Render Blueprints: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # OPTION A: Separate Backend Web Service + Frontend Static Site
  # -------------------------------------------------------------
  
  # 1. FastAPI Backend API
  - type: web
    name: ramshare-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RAMSHARE_MODE
        value: local
      - key: RAMSHARE_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. React + Vite Frontend (Free Static Site on Render CDN)
  - type: web
    name: ramshare-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Replace with your actual backend URL after creating the service (e.g. https://ramshare-backend.onrender.com)
        value: https://ramshare-backend.onrender.com
